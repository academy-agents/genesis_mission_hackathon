[project]
name = "genesis-mission-hackathon"
version = "0.1.0"
description = "Material for Genesis Mission Hackathon Oct 2026"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "academy-py",
    "globus-compute-sdk",
    "langgraph",
    "langchain-openai",
    "academy-dashboard",
    "globus-compute-endpoint>=4.18.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff.lint.per-file-ignores]
# Agents launched to remote sites must log with the root logger
"intermediate/04_dashboard/*" = ["LOG015"]
